# /etc/dovecot/dovecot.conf — buzones virtuales de @lexdata.com.ec.
# Sustituye la configuración de ejemplo de conf.d (no se incluye).

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

!include_try /usr/share/dovecot/protocols.d/*.protocol
protocols = imap lmtp sieve

log_path = syslog
auth_verbose = yes

# --- Autenticación ---------------------------------------------------------
auth_mechanisms = plain login
# Sin TLS solo se acepta contraseña desde el propio servidor (Roundcube).
auth_allow_cleartext = no
auth_username_format = %{user | lower}

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  default_password_scheme = ARGON2ID
}

userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
  fields {
    uid:default = vmail
    gid:default = vmail
    home:default = /var/vmail/%{user | domain}/%{user | username}
  }
}

# --- Buzones ---------------------------------------------------------------
mail_driver = maildir
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
    autoexpunge = 30d
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

# --- TLS -------------------------------------------------------------------
# Certificado de Let's Encrypt que obtiene Caddy (lo copia lexdata-mail-certs).
ssl = required
ssl_server_cert_file = /etc/ssl/lexdata-mail/fullchain.pem
ssl_server_key_file = /etc/ssl/lexdata-mail/privkey.pem
ssl_min_protocol = TLSv1.2

# --- Servicios -------------------------------------------------------------
service imap-login {
  # 143 solo en local, para Roundcube. Fuera, únicamente IMAPS 993.
  inet_listener imap {
    listen = 127.0.0.1
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service managesieve-login {
  inet_listener sieve {
    listen = 127.0.0.1
    port = 4190
  }
}

service auth {
  # Postfix valida aquí las contraseñas de quien envía (SMTP AUTH).
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

service auth-worker {
  user = $SET:default_internal_user
}

# --- Filtros (sieve) -------------------------------------------------------
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

protocol imap {
  mail_max_userip_connections = 30
}

# Antes que los filtros de cada usuario: lo marcado como spam va a "Junk".
sieve_script spam {
  type = before
  path = /etc/dovecot/sieve/spam.sieve
}

# Filtros y respuestas de ausencia que cada usuario crea desde Roundcube.
sieve_script personal {
  type = personal
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}
