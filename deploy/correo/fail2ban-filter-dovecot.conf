# /etc/fail2ban/filter.d/dovecot-lexdata.conf
# Fallos de contraseña con el formato de registro de Dovecot 2.4, p. ej.:
#   auth(usuario@lexdata.com.ec,203.0.113.5,sasl:plain)<id>: passwd-file: Password mismatch
[Definition]
failregex = \bauth\([^,()]*,<HOST>,[^)]*\)(?:<[^>]*>)?: passwd-file: (?:Password mismatch|unknown user)
ignoreregex =
journalmatch = _SYSTEMD_UNIT=dovecot.service
