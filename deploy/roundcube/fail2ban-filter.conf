# Inicios de sesión fallidos de Roundcube 1.7 (logs/userlogins.log), por ejemplo:
# [06-Nov-2026 03:26:58 +0000]: <fd113537> Failed login for usuario from 1.2.3.4 (X-Forwarded-For: ...) in session ...
# Se usa la IP real de la conexión, no la cabecera X-Forwarded-For, que el cliente puede falsificar.
[Definition]
failregex = <[0-9a-f]+> Failed login for .* from <HOST>(?: \(X-Forwarded-For: [^)]*\))? in session
ignoreregex =
datepattern = ^\[%%d-%%b-%%Y %%H:%%M:%%S %%z\]
