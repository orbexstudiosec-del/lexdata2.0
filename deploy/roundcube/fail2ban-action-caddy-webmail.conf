# /etc/fail2ban/action.d/caddy-webmail.conf
# Bloquea solo el webmail mediante Caddy (ver lexdata-webmail-bloqueo).
[Definition]
actionstart = /usr/local/bin/lexdata-webmail-bloqueo flush
actionstop  = /usr/local/bin/lexdata-webmail-bloqueo flush
actioncheck =
actionban   = /usr/local/bin/lexdata-webmail-bloqueo add <ip>
actionunban = /usr/local/bin/lexdata-webmail-bloqueo del <ip>
